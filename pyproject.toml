[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-random"
version = "0.1.0"
description = "CF-random: Predicting alternative conformations and fold-switching proteins"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "Public Domain (NCBI)"}
authors = [
    {name = "Myeongsang (Samuel) Lee"},
    {name = "Pramesh Sharma"},
]
keywords = ["protein-structure", "fold-switching", "alternative-conformation", "colabfold"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Public Domain",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.79,<1.80",
    "numpy>=1.20,<1.24",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "mdtraj",
    "MDAnalysis",
    "textalloc",
    "tmtools",
    "adjustText",
    "thefuzz",
]

[project.optional-dependencies]
colabfold = [
    "colabfold",
    "alphafold",
    "dm-tree",
]
dev = [
    "pytest>=7.0",
    "black",
    "isort",
    "flake8",
]
full = ["cf-random[colabfold,dev]"]

[project.urls]
Homepage = "https://github.com/ncbi/CF-random_software"

[project.scripts]
cf-random = "cf_random.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cf_random*", "code*"]

[tool.setuptools.package-data]
cf_random = ["data/*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100