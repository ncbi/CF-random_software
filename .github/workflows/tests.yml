name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      checks: write

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          activate-environment: cf-random
          python-version: '3.12'
          auto-activate-base: false

      - name: Cache conda environment
        uses: actions/cache@v4
        id: conda-cache
        with:
          path: ${{ env.CONDA }}/envs/cf-random
          key: conda-${{ runner.os }}-${{ hashFiles('install.sh') }}

      - name: Install dependencies
        if: steps.conda-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x install.sh
          ./install.sh

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=cf_random --cov-report=xml:coverage.xml --cov-report=term-missing | tee pytest-coverage.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            pytest-coverage.txt